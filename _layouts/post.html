---
layout: default
---
<article class="post-page">
  <header class="article-header">
    <p class="article-meta">{{ page.date | date: "%B %d, %Y" }}</p>
    <h1>{{ page.title }}</h1>
  </header>

  {% if page.image_path %}
    <img class="article-image" src="{{ page.image_path | relative_url }}" alt="" loading="eager">
  {% endif %}

  <div class="entry">
    {{ content }}
  </div>
</article>
